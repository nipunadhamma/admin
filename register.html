
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Create your LankaQuest Tourist or Guide account.">

    <title>LankaQuest - Register</title>


    <!-- =========================================================
       STYLES
  ========================================================== -->

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/register.css">

</head>


<body>


    <!-- =========================================================
       HEADER
  ========================================================== -->

    <header class="site-header">

        <div class="container header-container">

            <a href="index.html" class="logo">
                LankaQuest
            </a>


            <nav class="main-nav">

                <a href="index.html">
                    Home
                </a>

                <a href="attractions.html">
                    Attractions
                </a>

                <a href="find-guides.html">
                    Find Guides
                </a>

                <a href="login.html">
                    Login
                </a>

            </nav>

        </div>

    </header>


    <!-- =========================================================
       REGISTER PAGE
  ========================================================== -->

    <main class="auth-page">


        <div class="auth-container">


            <!-- =====================================================
           REGISTER CARD
      ====================================================== -->

            <section class="auth-card">


                <!-- ===================================================
             TITLE
        ==================================================== -->

                <div class="auth-header">

                    <h1>
                        Create Your Account
                    </h1>

                    <p>
                        Join LankaQuest and start planning your
                        Sri Lankan journey.
                    </p>

                </div>


                <!-- ===================================================
             REGISTRATION MESSAGE
        ==================================================== -->

                <div id="registrationMessage" class="auth-message" style="display: none;"></div>


                <!-- ===================================================
             REGISTRATION FORM
        ==================================================== -->

                <form id="registrationForm" novalidate>


                    <!-- =================================================
               ACCOUNT TYPE
          ================================================== -->

                    <div class="form-group">

                        <label>
                            Account Type
                        </label>


                        <div class="account-type-options">


                            <!-- =============================================
                   TOURIST
              ============================================== -->

                            <label class="account-type-option">

                                <input type="radio" name="accountType" value="tourist" checked>

                                <span>
                                    🧳 Tourist
                                </span>

                            </label>


                            <!-- =============================================
                   GUIDE
              ============================================== -->

                            <label class="account-type-option">

                                <input type="radio" name="accountType" value="guide">

                                <span>
                                    🧑‍💼 Tour Guide
                                </span>

                            </label>


                        </div>

                    </div>


                    <!-- =================================================
               COMMON INFORMATION
          ================================================== -->

                    <div class="form-group">

                        <label for="fullName">
                            Full Name
                        </label>

                        <input type="text" id="fullName" name="fullName" placeholder="Enter your full name"
                            autocomplete="name" required>

                    </div>


                    <!-- =================================================
               EMAIL
          ================================================== -->

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input type="email" id="email" name="email" placeholder="Enter your email address"
                            autocomplete="email" required>

                    </div>


                    <!-- =================================================
               PASSWORD
          ================================================== -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input type="password" id="password" name="password" placeholder="Create a password"
                            autocomplete="new-password" minlength="6" required>

                    </div>


                    <!-- =================================================
               CONFIRM PASSWORD
          ================================================== -->

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input type="password" id="confirmPassword" name="confirmPassword"
                            placeholder="Confirm your password" autocomplete="new-password" minlength="6" required>

                    </div>


                    <!-- =================================================
               TOURIST FIELDS
          ================================================== -->

                    <div id="touristFields">


                        <div class="form-group">

                            <label for="country">
                                Country
                            </label>

                            <input type="text" id="country" name="country" placeholder="Enter your country"
                                autocomplete="country-name">

                        </div>


                    </div>


                    <!-- =================================================
               GUIDE FIELDS
          ================================================= -->

                    <div id="guideFields" class="hidden">


                        <!-- ===============================================
                 PHONE
            ================================================ -->

                        <div class="form-group">

                            <label for="phone">
                                Phone Number
                            </label>

                            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number"
                                autocomplete="tel">

                        </div>


                        <!-- ===============================================
                 DISTRICT
            ================================================ -->

                        <div class="form-group">

                            <label for="guideDistrict">
                                District
                            </label>

                            <select id="guideDistrict" name="guideDistrict">

                                <option value="">
                                    Select your district
                                </option>

                                <option value="Ampara">
                                    Ampara
                                </option>

                                <option value="Anuradhapura">
                                    Anuradhapura
                                </option>

                                <option value="Badulla">
                                    Badulla
                                </option>

                                <option value="Batticaloa">
                                    Batticaloa
                                </option>

                                <option value="Colombo">
                                    Colombo
                                </option>

                                <option value="Galle">
                                    Galle
                                </option>

                                <option value="Gampaha">
                                    Gampaha
                                </option>

                                <option value="Hambantota">
                                    Hambantota
                                </option>

                                <option value="Jaffna">
                                    Jaffna
                                </option>

                                <option value="Kalutara">
                                    Kalutara
                                </option>

                                <option value="Kandy">
                                    Kandy
                                </option>

                                <option value="Kegalle">
                                    Kegalle
                                </option>

                                <option value="Kilinochchi">
                                    Kilinochchi
                                </option>

                                <option value="Kurunegala">
                                    Kurunegala
                                </option>

                                <option value="Mannar">
                                    Mannar
                                </option>

                                <option value="Matale">
                                    Matale
                                </option>

                                <option value="Matara">
                                    Matara
                                </option>

                                <option value="Monaragala">
                                    Monaragala
                                </option>

                                <option value="Mullaitivu">
                                    Mullaitivu
                                </option>

                                <option value="Nuwara Eliya">
                                    Nuwara Eliya
                                </option>

                                <option value="Polonnaruwa">
                                    Polonnaruwa
                                </option>

                                <option value="Puttalam">
                                    Puttalam
                                </option>

                                <option value="Ratnapura">
                                    Ratnapura
                                </option>

                                <option value="Trincomalee">
                                    Trincomalee
                                </option>

                                <option value="Vavuniya">
                                    Vavuniya
                                </option>

                            </select>

                        </div>


                        <!-- ===============================================
                 LANGUAGES
            ================================================ -->

                        <div class="form-group">

                            <label for="languages">
                                Languages
                            </label>

                            <input type="text" id="languages" name="languages"
                                placeholder="e.g. English, Sinhala, Tamil">

                        </div>


                        <!-- ===============================================
                 EXPERIENCE
            ================================================ -->

                        <div class="form-group">

                            <label for="experience">
                                Experience
                            </label>

                            <select id="experience" name="experience">

                                <option value="">
                                    Select experience
                                </option>

                                <option value="Less than 1 year">
                                    Less than 1 year
                                </option>

                                <option value="1-3 years">
                                    1-3 years
                                </option>

                                <option value="3-5 years">
                                    3-5 years
                                </option>

                                <option value="5-10 years">
                                    5-10 years
                                </option>

                                <option value="10+ years">
                                    10+ years
                                </option>

                            </select>

                        </div>


                    </div>


                    <!-- =================================================
               SUBMIT
          ================================================== -->

                    <button type="submit" class="auth-button">
                        Create Account
                    </button>


                </form>


                <!-- ===================================================
             LOGIN LINK
        ==================================================== -->

                <div class="auth-footer">

                    <p>

                        Already have an account?

                        <a href="login.html">
                            Login
                        </a>

                    </p>

                </div>


            </section>


        </div>


    </main>


    <!-- =========================================================
       FIREBASE / REGISTRATION SCRIPT
  ========================================================== -->

    <script type="module" src="js/register.js"></script>


</body>

</html>
